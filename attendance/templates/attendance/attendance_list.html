<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Attendance</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 24px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px 10px;
            text-align: left;
        }

        th {
            background: #f5f5f5;
        }

        .yes {
            color: #0a7;
            font-weight: bold;
        }

        .no {
            color: #c22;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Attendance Records</h1>
    {% if records %}
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Student</th>
                <th>Classroom</th>
                <th>Present</th>
            </tr>
        </thead>
        <tbody>
            {% for record in records %}
            <tr>
                <td>{{ record.date }}</td>
                <td>{{ record.student.name }}</td>
                <td>{{ record.student.classroom }}</td>
                <td>
                    {% if record.present %}
                    <span class="yes">Yes</span>
                    {% else %}
                    <span class="no">No</span>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p>No attendance records yet.</p>
    {% endif %}
</body>

</html>
